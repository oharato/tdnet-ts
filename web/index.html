<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🎁 株主優待 新着情報 - TDnet Viewer</title>
    <!-- Alpine JS -->
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <!-- Fonts -->
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=Noto+Sans+JP:wght@400;600;800&display=swap"
        rel="stylesheet">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="style.css">
</head>

<body x-data="yutaiApp()">
    <header class="glass-header">
        <div class="container">
            <div class="header-content">
                <div>
                    <h1>株主優待 新着情報</h1>
                    <p>TDnetから取得した最新の優待関連開示です</p>
                </div>
                <div class="header-actions">
                    <button class="btn-refresh" @click="fetchData()" :disabled="loading" title="データを再読み込み">
                        <svg x-show="!loading" xmlns="http://www.w3.org/2000/svg" width="20" height="20"
                            viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                            stroke-linecap="round" stroke-linejoin="round">
                            <path d="M21 2v6h-6" />
                            <path d="M3 12a9 9 0 1 0 2.6-6.4L2 9" />
                        </svg>
                        <div x-show="loading" class="spinner-small"></div>
                        <span x-text="loading ? '更新中...' : '更新'"></span>
                    </button>
                </div>
            </div>
        </div>
    </header>

    <main class="container">
        <div class="toolbar glass-panel">
            <div class="search-wrap">
                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none"
                    stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                    class="search-icon">
                    <circle cx="11" cy="11" r="8" />
                    <path d="m21 21-4.3-4.3" />
                </svg>
                <input type="text" x-model="searchQuery" placeholder="企業名やタイトル、本文で検索..." class="search-input">
                <button x-show="searchQuery" @click="searchQuery = ''" class="btn-clear" title="クリア">
                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none"
                        stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M18 6 6 18" />
                        <path d="m6 6 12 12" />
                    </svg>
                </button>
            </div>
            <div class="stats">
                表示 <span x-text="filteredItems.length"></span> <span class="stats-total">/ 全 <span
                        x-text="items.length"></span> 件</span>
            </div>
        </div>

        <div x-show="loading && items.length === 0" class="loading-state">
            <div class="spinner"></div>
            <p>データを読み込んでいます...</p>
        </div>

        <div class="grid" x-show="!loading || items.length > 0">
            <template x-for="item in filteredItems" :key="item.documentUrl">
                <article class="card">
                    <div class="card-header">
                        <span class="ticker" x-text="item.ticker"></span>
                        <h2 class="company" x-text="item.companyName"></h2>
                    </div>

                    <div class="pub-date">
                        <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none"
                            stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <circle cx="12" cy="12" r="10" />
                            <polyline points="12 6 12 12 16 14" />
                        </svg>
                        <span x-text="formatDate(item.publishedAt)"></span>
                    </div>

                    <h3 class="title">
                        <a :href="'pdfs/' + item.id + '.pdf'" target="_blank" rel="noopener noreferrer"
                            x-text="item.title" title="ローカルのPDFを開く"></a>
                        <a :href="item.documentUrl" target="_blank" rel="noopener noreferrer" title="TDnetの元URLを開く"
                            style="font-size:0.8em; margin-left:0.4rem; color:var(--text-muted); text-decoration:none;">[TDnet]</a>
                    </h3>

                    <div class="content-toggle" x-show="item.content">
                        <button @click="item.expanded = !item.expanded" class="btn-toggle"
                            :class="{ 'active': item.expanded }">
                            <span x-text="item.expanded ? '本文を閉じる' : '本文を読む'"></span>
                            <svg :class="{'rotate-180': item.expanded}" xmlns="http://www.w3.org/2000/svg" width="18"
                                height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                                stroke-linecap="round" stroke-linejoin="round">
                                <path d="m6 9 6 6 6-6" />
                            </svg>
                        </button>
                    </div>

                    <div class="content-area"
                        x-show="item.expanded || (searchQuery && item.content?.includes(searchQuery))" x-transition>
                        <div class="markdown-content" x-html="highlightText(item.content || item.snippet || '')"></div>
                    </div>
                </article>
            </template>

            <div x-show="filteredItems.length === 0 && (!loading || items.length > 0)" class="empty-state glass-panel">
                <svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 24 24" fill="none"
                    stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="11" cy="11" r="8" />
                    <path d="m21 21-4.3-4.3" />
                </svg>
                <h3>見つかりませんでした</h3>
                <p>「<span x-text="searchQuery"></span>」に一致する結果がありません。</p>
            </div>
        </div>
    </main>

    <script>
        function yutaiApp() {
            return {
                items: [],
                searchQuery: '',
                loading: true,

                async init() {
                    await this.fetchData();
                },

                async fetchData() {
                    this.loading = true;
                    try {
                        // yutai.json は `npm run web:export` 等で生成されます
                        const res = await fetch('yutai.json');
                        if (!res.ok) throw new Error('Failed to fetch data');
                        const data = await res.json();
                        // 展開フラグを付与
                        this.items = data.map(item => ({
                            ...item,
                            expanded: false
                        }));
                    } catch (e) {
                        console.error('Failed to load yutai.json', e);
                    } finally {
                        this.loading = false;
                    }
                },

                get filteredItems() {
                    if (!this.searchQuery.trim()) return this.items;

                    const q = this.searchQuery.toLowerCase().trim();
                    const normalizeRegex = /[\u3041-\u3096]/g;
                    const toKana = (str) => str.replace(normalizeRegex, match => String.fromCharCode(match.charCodeAt(0) + 0x60));

                    const queryKana = toKana(q);

                    return this.items.filter(item => {
                        const company = item.companyName.toLowerCase();
                        const title = item.title.toLowerCase();
                        const content = (item.content || '').toLowerCase();

                        return company.includes(q) || toKana(company).includes(queryKana) ||
                            title.includes(q) || toKana(title).includes(queryKana) ||
                            item.ticker.includes(q) ||
                            content.includes(q);
                    });
                },

                formatDate(dateStr) {
                    const d = new Date(dateStr);
                    return d.toLocaleString('ja-JP', {
                        year: 'numeric', month: '2-digit', day: '2-digit',
                        hour: '2-digit', minute: '2-digit'
                    });
                },

                highlightText(text) {
                    if (!text) return '';

                    // 改行をbrタグに変換 & htmlエンティティをエスケープ
                    const escapeHtml = (unsafe) => {
                        return unsafe
                            .replace(/&/g, "&amp;")
                            .replace(/</g, "&lt;")
                            .replace(/>/g, "&gt;")
                            .replace(/"/g, "&quot;")
                            .replace(/'/g, "&#039;");
                    };

                    let htmlText = escapeHtml(text).replace(/\n/g, '<br/>');

                    if (!this.searchQuery.trim()) return htmlText;

                    try {
                        // 簡単なハイライト処理
                        const q = this.searchQuery.trim().replace(/[.*+?^${}()|[\]\\]/g, '\\$&'); // 正規表現エスケープ
                        const regex = new RegExp(`(${q})`, 'gi');
                        return htmlText.replace(regex, '<mark>$1</mark>');
                    } catch (e) {
                        return htmlText;
                    }
                }
            }
        }
    </script>
</body>

</html>
