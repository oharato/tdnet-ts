<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🎁 株主優待 新着情報 - TDnet Viewer</title>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=Noto+Sans+JP:wght@400;600;800&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body x-data="yutaiApp()" :data-theme="theme">

    <!-- ヘッダー -->
    <header class="app-header">
        <h1>🎁 株主優待 新着情報</h1>
        <div class="header-right">
            <span class="header-meta" x-text="filteredItems.length + ' / ' + items.length + ' 件'"></span>
            <button class="theme-toggle" @click="toggleTheme()"
                :title="theme === 'dark' ? 'ライトモードに切り替え' : 'ダークモードに切り替え'">
                <span x-text="theme === 'dark' ? '☀️' : '🌙'"></span>
            </button>
        </div>
    </header>

    <div class="app-layout">

        <!-- 左カラム: 一覧 -->
        <aside class="sidebar">
            <div class="sidebar-search">
                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none"
                    stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="11" cy="11" r="8" />
                    <path d="m21 21-4.3-4.3" />
                </svg>
                <input type="text" x-model="searchQuery" placeholder="検索…" class="search-input">
                <button x-show="searchQuery" @click="searchQuery = ''" class="btn-clear">&times;</button>
            </div>

            <div class="sidebar-list" x-show="!loading || items.length > 0">
                <template x-for="item in filteredItems" :key="item.id">
                    <button class="list-item" :class="{ 'active': selected?.id === item.id }" @click="selected = item">
                        <div class="list-item-header">
                            <span class="ticker" x-text="item.ticker"></span>
                            <span class="company" x-text="item.companyName"></span>
                        </div>
                        <div class="list-item-title" x-text="item.title"></div>
                        <div class="list-item-date" x-text="formatDate(item.publishedAt)"></div>
                    </button>
                </template>
                <div x-show="filteredItems.length === 0" class="empty-list">
                    一致する結果がありません
                </div>
            </div>

            <div x-show="loading && items.length === 0" class="loading-state">
                <div class="spinner"></div>
                <span>読み込み中…</span>
            </div>
        </aside>

        <!-- 右カラム: 詳細 -->
        <main class="content-panel">
            <!-- 未選択状態 -->
            <div x-show="!selected" class="content-empty">
                <svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 24 24" fill="none"
                    stroke="currentColor" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"
                    style="opacity:0.3">
                    <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z" />
                    <polyline points="14 2 14 8 20 8" />
                </svg>
                <p>左の一覧から開示情報を選択してください</p>
            </div>

            <!-- 選択済み -->
            <template x-if="selected">
                <div class="detail">
                    <div class="detail-header">
                        <div class="detail-meta">
                            <span class="ticker-lg" x-text="selected.ticker"></span>
                            <h2 x-text="selected.companyName"></h2>
                        </div>
                        <time x-text="formatDate(selected.publishedAt)"></time>
                    </div>

                    <h3 class="detail-title" x-text="selected.title"></h3>

                    <div class="detail-links">
                        <a :href="'pdfs/' + selected.id + '.pdf'" target="_blank" rel="noopener noreferrer"
                            class="link-btn primary">
                            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24"
                                fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                                stroke-linejoin="round">
                                <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z" />
                                <polyline points="14 2 14 8 20 8" />
                            </svg>
                            ローカル PDF
                        </a>
                        <a :href="selected.documentUrl" target="_blank" rel="noopener noreferrer" class="link-btn">
                            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24"
                                fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                                stroke-linejoin="round">
                                <path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6" />
                                <polyline points="15 3 21 3 21 9" />
                                <line x1="10" y1="14" x2="21" y2="3" />
                            </svg>
                            TDnet 元URL
                        </a>
                    </div>

                    <div class="detail-content" x-show="selected.content">
                        <div class="content-body" x-html="highlightText(selected.content || '')"></div>
                    </div>
                    <div class="detail-content no-content" x-show="!selected.content">
                        <p>本文データがありません。<code>--content</code> オプション付きでエクスポートしてください。</p>
                    </div>
                </div>
            </template>
        </main>
    </div>

    <script>
        function yutaiApp() {
            return {
                items: [],
                searchQuery: '',
                loading: true,
                selected: null,
                theme: localStorage.getItem('theme') || 'dark',

                async init() {
                    await this.fetchData();
                },

                toggleTheme() {
                    this.theme = this.theme === 'dark' ? 'light' : 'dark';
                    localStorage.setItem('theme', this.theme);
                },

                async fetchData() {
                    this.loading = true;
                    try {
                        const res = await fetch('yutai.json');
                        if (!res.ok) throw new Error('Failed to fetch data');
                        const data = await res.json();
                        this.items = data;
                        if (this.items.length > 0) this.selected = this.items[0];
                    } catch (e) {
                        console.error('Failed to load yutai.json', e);
                    } finally {
                        this.loading = false;
                    }
                },

                get filteredItems() {
                    if (!this.searchQuery.trim()) return this.items;
                    const q = this.searchQuery.toLowerCase().trim();
                    return this.items.filter(item => {
                        return item.companyName.toLowerCase().includes(q) ||
                            item.title.toLowerCase().includes(q) ||
                            item.ticker.includes(q) ||
                            (item.content || '').toLowerCase().includes(q);
                    });
                },

                formatDate(dateStr) {
                    const d = new Date(dateStr);
                    return d.toLocaleString('ja-JP', {
                        year: 'numeric', month: '2-digit', day: '2-digit',
                        hour: '2-digit', minute: '2-digit'
                    });
                },

                highlightText(text) {
                    if (!text) return '';
                    const esc = (s) => s
                        .replace(/&/g, "&amp;").replace(/</g, "&lt;")
                        .replace(/>/g, "&gt;").replace(/"/g, "&quot;");
                    let html = esc(text).replace(/\n/g, '<br/>');
                    if (!this.searchQuery.trim()) return html;
                    try {
                        const q = this.searchQuery.trim().replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
                        return html.replace(new RegExp(`(${q})`, 'gi'), '<mark>$1</mark>');
                    } catch { return html; }
                }
            }
        }
    </script>
</body>

</html>
